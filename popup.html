<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ads.txt Line Validator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Ads.txt / App-ads.txt Line Checker</h2>
  <div class="container">
    <div class="settings-bar">
      <div>
        <label>File Type:</label>
        <select id="fileType">
          <option value="app-ads.txt">app-ads.txt</option>
          <option value="ads.txt">ads.txt</option>
          <option value="url">URL (direct link)</option>
        </select>
      </div>
      <div>
        <label>Filter:</label>
        <select id="viewMode">
          <option value="all">Show All Results</option>
          <option value="errors">Errors / Warnings Only</option>
        </select>
      </div>
      <div>
        <label>Layout:</label>
        <select id="tableLayout">
          <option value="standard">Standard</option>
          <option value="grouped">Grouped by Target</option>
        </select>
      </div>
      <div>
        <label>Batch Size:</label>
        <select id="batchSize">
          <option value="1">1</option>
          <option value="2"selected>2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <label id="targetLabel">Target Websites</label>
        <textarea id="targetList" placeholder="example.com&#10;another-site.com"></textarea>
      </div>
      <div class="col">
        <label>Reference Lines</label>
        <textarea id="refList" placeholder="google.com, pub-1234, DIRECT&#10;adnetwork.com, 9876, RESELLER"></textarea>
      </div>
    </div>
    <div class="button-row">
      <button id="runBtn">Start Validation</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>
    <div class="progress-container" id="progressContainer">
      <div id="progressBar"></div>
    </div>
    <div class="status-bar" id="statusText">Ready</div>
    <div class="stats-bar" id="statsBar"></div>
    <div class="table-wrapper">
      <table id="resultsTable">
        <thead id="resultsHead">
          <tr>
            <th>Target URL</th>
            <th>Reference</th>
            <th>Result</th>
            <th>Details</th>
            <th>Owner</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="button-row">
      <button id="downloadBtn">Download CSV</button>
      <button id="copyBtn">Copy to Clipboard</button>
    </div>
  </div>
  <div class="oss-bar">
    <span class="oss-bar__text">Open-source project:</span>
    <a class="oss-bar__link" href="https://github.com/Chrome-Extensions-labs/Inventory-Auth-Auditor" target="_blank" rel="noopener noreferrer">
      GitHub
      <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
